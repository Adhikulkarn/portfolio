services:
  # --- Backend Web Service ---
  - type: web
    name: portfolio-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    releaseCommand: python manage.py migrate
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # Prompt user during setup for Neon DB URL
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        # Enter your Vercel deployment URL here (e.g. https://your-portfolio.vercel.app)
      - key: CSRF_TRUSTED_ORIGINS
        # Enter your Vercel deployment URL here (e.g. https://your-portfolio.vercel.app)
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
