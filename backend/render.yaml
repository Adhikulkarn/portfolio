services:
  - type: web
    name: portfolio-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    releaseCommand: python manage.py migrate
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # Leave value empty to prompt the user during deployment,
        # or they can paste their Neon database URL from .env
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:3000"
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
